name: validate

# Runs on every push and pull request. Needs no secrets and never calls a model.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # skills-ref from the Agent Skills spec repo, pinned (PyPI's skills-ref ships a different CLI name)
  SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat .github/claude-code-version)"
          pip install "${SKILLS_REF}"

      - name: claude plugin validate (strict)
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

      - name: skills-ref validate
        run: for s in plugins/*/skills/*/ .claude/skills/*/; do [ -d "$s" ] && skills-ref validate "$s"; done

      - name: Skill rules (bin/check-skills)
        run: |
          # Version bumps are owed relative to what is released (stable), not to the previous push,
          # so several commits to one unreleased change need a single bump.
          base=$(git rev-parse -q --verify origin/stable || git rev-parse -q --verify origin/main || true)
          bin/check-skills ${base:+--base "$base"}

      - name: Lint workflows (actionlint, pinned and checksum-verified)
        run: |
          v=1.7.7; sum=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/al.tgz"
          echo "$sum  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: skills-sync behavior test
        run: tests/skills-sync-test.sh "$RUNNER_TEMP/skills-sync-test"

      - name: CI token expiry
        run: |
          exp=$(cat .github/ci-token-expires); now=$(date -u +%F); warn=$(date -u -d "$exp -30 days" +%F)
          if [[ "$now" > "$exp" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN expired on $exp. Rotate it (docs/runbook.md) and update .github/ci-token-expires"; exit 1
          elif [[ "$now" > "$warn" ]]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN expires on $exp. Rotate it soon (docs/runbook.md)"
          fi

      - name: Summarize changes to allowed-tools, hooks, scripts and ! injection
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)   # first push: compare with the empty tree
          fi
          added_removed() { git diff -U0 "$base" HEAD -- "$@" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true; }
          section() { echo "### $1"; if [ -n "$2" ]; then echo '```'; echo "$2"; echo '```'; else echo "none"; fi; echo; }
          # shellcheck disable=SC2016  # the backticks below are a literal grep pattern for `!` injection
          {
            echo "## Sensitive changes since ${base:0:12}"
            section "allowed-tools" "$(added_removed '*SKILL.md' | grep -E '^[+-]allowed-tools:' || true)"
            section "hooks" "$(git diff --name-status "$base" HEAD | grep -E '(^|/)hooks(/|\.json)' || true; added_removed '*.md' '*.json' | grep -E '"hooks"|^[+-]hooks:' || true)"
            section "scripts and workflows" "$(git diff --name-status "$base" HEAD | grep -E '(^|[[:space:]])(bin|scripts|tests|\.github/workflows)/|/scripts/|\.sh$' || true)"
            section "! shell injection in skill text" "$(added_removed 'plugins/*.md' '.claude/*.md' | grep -E '(^[+-]|[^`])!`[^`]+`' || true)"
          } >> "$GITHUB_STEP_SUMMARY"
