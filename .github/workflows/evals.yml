name: evals

# Model-backed evals. They run only on pull requests that touch a skill, its evals or the
# shared fixture, or when started by hand. This is `pull_request`, never `pull_request_target`:
# a pull request from a fork gets no secrets, and the job below skips it.
on:
  pull_request:
    paths: ["plugins/**", "evals/**", "fixtures/**"]
  workflow_dispatch:
    inputs:
      skills:
        description: Skills to evaluate, space-separated, or "changed" for the ones changed since stable
        default: changed
      promote:
        description: If every evaluated skill passes, fast-forward stable to this commit and tag the releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.301
  EVAL_MODEL: claude-sonnet-5-5
  JUDGE_MODEL: claude-haiku-5-5
  THRESHOLD: "0.8"
  MAX_COST_USD: "10"
  MIN_DELTA: "0.1"

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      skills: ${{ steps.pick.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Pick skills to evaluate
        id: pick
        env:
          INPUT_SKILLS: ${{ inputs.skills }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="origin/$BASE_REF"
          elif git rev-parse -q --verify origin/stable >/dev/null; then base=origin/stable
          else base=""; fi
          all=$(ls plugins | tr '\n' ' ')
          if [ -n "$INPUT_SKILLS" ] && [ "$INPUT_SKILLS" != changed ]; then skills=$INPUT_SKILLS
          elif [ -z "$base" ]; then skills=$all
          elif git diff --name-only "$base"...HEAD -- fixtures evals | grep -q .; then skills=$all   # shared fixture or collision suite changed
          else skills=$(git diff --name-only "$base"...HEAD -- plugins | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          for s in $skills; do [ -d "plugins/$s" ] || { echo "::error::no such skill: $s"; exit 1; }; done
          echo "skills=$(echo $skills)" >> "$GITHUB_OUTPUT"
          echo "Evaluating: ${skills:-none} (base: ${base:-none})"

      - name: Run each skill's suite, then the collision suite
        if: steps.pick.outputs.skills != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKILLS: ${{ steps.pick.outputs.skills }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::repository secret CLAUDE_CODE_OAUTH_TOKEN is not set"; exit 1; }
          mkdir -p eval-out; rc=0
          common=(--trust-plugin --no-publish --model "$EVAL_MODEL" --judge-model "$JUDGE_MODEL" --threshold "$THRESHOLD" --max-cost-usd "$MAX_COST_USD")
          for s in $SKILLS; do
            # --scaffold runs the fixture.sh files in this repo's own eval cases
            claude plugin eval "plugins/$s" --scaffold "${common[@]}" --json "eval-out/$s.json" --report "eval-out/$s.html" || rc=1
          done
          # from the repo root the runner also finds every plugin's cases; --case keeps only the <skill>--<case> collision copies
          claude plugin eval . --case '*--*' --ablation none --runs 1 "${common[@]}" --json eval-out/collision.json --report eval-out/collision.html || rc=1
          exit $rc

      - name: Summarize
        if: always() && steps.pick.outputs.skills != ''
        run: |
          {
            echo "## Evals: $EVAL_MODEL, judge $JUDGE_MODEL, threshold $THRESHOLD"
            echo "| Suite | Cases passed | Score | Δ on trigger cases | Cost |"
            echo "|---|---|---|---|---|"
            for f in eval-out/*.json; do
              jq -r --arg name "$(basename "$f" .json)" --argjson min "$MIN_DELTA" '
                ([.cases[] | select(.name | test("nomatch-") | not) | .aggregates.delta // empty]) as $d
                | (if ($d | length) > 0 then ($d | add / length) else null end) as $td
                | "| \($name) | \(.aggregates.casesPassed)/\(.aggregates.casesTotal) | \(.aggregates.overallScore * 100 | round / 100)"
                  + " | \(if $td == null then "n/a" elif $td < $min then "**\($td * 100 | round / 100): does not beat the baseline**" else ($td * 100 | round / 100 | tostring) end)"
                  + " | $\(.costUsd * 100 | round / 100) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pick.outputs.skills != ''
        with:
          name: eval-results
          path: eval-out/
          if-no-files-found: ignore

  promote:
    needs: evals
    if: github.event_name == 'workflow_dispatch' && inputs.promote && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SKILLS: ${{ needs.evals.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Every changed skill has a new version and a changelog entry
        run: |
          for s in $SKILLS; do
            new=$(jq -r .version "plugins/$s/.claude-plugin/plugin.json")
            old=$(git show "origin/stable:plugins/$s/.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)
            [ "$new" != "$old" ] || { echo "::error::$s changed but its version is still $new"; exit 1; }
            grep -q "^## $new\$" "plugins/$s/CHANGELOG.md" || { echo "::error::plugins/$s/CHANGELOG.md has no '## $new' entry"; exit 1; }
          done

      - name: Fast-forward stable and tag each release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/stable   # refused unless it is a fast-forward
          for s in $SKILLS; do claude plugin tag "plugins/$s" --push; done
